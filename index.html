<script>
  let openaiKey = ""; // Shared OpenAI key (in-memory)

  function showAdmin() {
    document.getElementById("roleSelect").classList.add("d-none");
    document.getElementById("adminSection").classList.remove("d-none");
  }

  function showUser() {
    document.getElementById("roleSelect").classList.add("d-none");
    document.getElementById("userSection").classList.remove("d-none");

    // If openaiKey is not set, disable the form
    if (!openaiKey) {
      document.getElementById("userMessage").textContent =
        "❗ Admin has not set the OpenAI key yet. Please try again later.";
      document.getElementById("userForm").querySelector("button").disabled = true;
    } else {
      document.getElementById("userMessage").textContent = "";
      document.getElementById("userForm").querySelector("button").disabled = false;
    }
  }

  function goBack() {
    document.getElementById("adminSection").classList.add("d-none");
    document.getElementById("userSection").classList.add("d-none");
    document.getElementById("roleSelect").classList.remove("d-none");

    // Reset forms and messages
    document.getElementById("adminForm").reset();
    document.getElementById("openaiForm").reset();
    document.getElementById("userForm").reset();
    document.getElementById("adminLoginMessage").textContent = "";
    document.getElementById("openaiMessage").textContent = "";
    document.getElementById("userMessage").textContent = "";
    document.getElementById("openaiForm").classList.add("d-none");
  }

  document.getElementById("adminForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const password = document.getElementById("adminPassword").value;

    if (password === "WEN@5050_andrady") {
      document.getElementById("adminLoginMessage").textContent =
        "✅ Password correct. Enter OpenAI Key below.";
      document.getElementById("openaiForm").classList.remove("d-none");
    } else {
      document.getElementById("adminLoginMessage").textContent =
        "❌ Incorrect password.";
      document.getElementById("openaiForm").classList.add("d-none");
    }
  });

  document.getElementById("openaiForm").addEventListener("submit", function (e) {
    e.preventDefault();
    openaiKey = document.getElementById("openaiKey").value;
    document.getElementById("openaiMessage").textContent =
      "✅ OpenAI Key saved globally. Users can now use the bot.";
  });

  document.getElementById("userForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const tradingKey = document.getElementById("tradingKey").value;
    const exchange = document.getElementById("exchange").value;

    if (!openaiKey) {
      document.getElementById("userMessage").textContent =
        "❗ Admin must set OpenAI key first.";
      return;
    }

    const res = await fetch("/start-bot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        openai_key: openaiKey,
        trading_key: tradingKey,
        exchange: exchange
      }),
    });

    const data = await res.json();
    if (data.message) {
      document.getElementById("userMessage").textContent = "✅ " + data.message;
    } else {
      document.getElementById("userMessage").textContent =
        "❌ " + (data.error || "Something went wrong.");
    }
  });
</script>
