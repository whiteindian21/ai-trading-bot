<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0e0e0e;
      color: #fff;
    }
    .container {
      margin-top: 50px;
      max-width: 500px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="text-center mb-4">AI Trading Bot</h2>

  <div id="roleSelection">
    <button class="btn btn-primary w-100 mb-2" onclick="showAdminLogin()">Admin Login</button>
    <button class="btn btn-secondary w-100" onclick="showUserSection()">User Access</button>
  </div>

  <!-- Admin Login -->
  <div id="adminLogin" class="hidden">
    <h4 class="mt-4">Admin Login</h4>
    <input type="password" id="adminPass" class="form-control mb-3" placeholder="Enter Admin Password">
    <button class="btn btn-warning w-100" onclick="loginAdmin()">Login as Admin</button>
  </div>

  <!-- Admin API Key Input -->
  <div id="adminSection" class="hidden">
    <h4 class="mt-4">Set OpenAI API Key</h4>
    <input type="text" id="adminApiKey" class="form-control mb-3" placeholder="OpenAI API Key">
    <button class="btn btn-success w-100" onclick="saveAdminApiKey()">Save API Key</button>
  </div>

  <!-- User Section -->
  <div id="userSection" class="hidden">
    <h4 class="mt-4">User Settings</h4>
    <input type="text" id="userTradingApi" class="form-control mb-3" placeholder="Your Binance/Coinbase API Key">
    <button class="btn btn-info w-100" onclick="startBot()">Start Trading Bot</button>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "admin123"; // 🔒 Replace with a more secure method in production
  let savedOpenAIKey = "";

  function showAdminLogin() {
    document.getElementById('roleSelection').classList.add('hidden');
    document.getElementById('adminLogin').classList.remove('hidden');
  }

  function showUserSection() {
    document.getElementById('roleSelection').classList.add('hidden');
    document.getElementById('userSection').classList.remove('hidden');
  }

  function loginAdmin() {
    const input = document.getElementById('adminPass').value;
    if (input === ADMIN_PASSWORD) {
      document.getElementById('adminLogin').classList.add('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
    } else {
      alert('Wrong password');
    }
  }

  function saveAdminApiKey() {
    savedOpenAIKey = document.getElementById('adminApiKey').value;
    alert("API Key saved successfully.");
  }

  async function startBot() {
    const userKey = document.getElementById('userTradingApi').value;
    if (!userKey || !savedOpenAIKey) {
      alert("Missing API keys.");
      return;
    }

    const response = await fetch("https://your-backend-url.com/start-bot", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        openai_key: savedOpenAIKey,
        trading_key: userKey
      })
    });

    const data = await response.json();
    alert("Bot Started: " + JSON.stringify(data));
  }
</script>
</body>
</html>
